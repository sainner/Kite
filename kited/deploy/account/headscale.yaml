server_url: https://hs.sainner.top
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
noise:
  private_key_path: /data/noise_private.key
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential
derp:
  server:
    enabled: true
    region_id: 999
    region_code: kite-hk
    region_name: Kite 香港
    verify_clients: true
    stun_listen_addr: 0.0.0.0:3478
    private_key_path: /data/derp_server_private.key
    automatically_add_embedded_derp_region: true
    ipv4: 103.61.39.246
  # 只用自建的香港区域。多区域时，节点上报的主中继可能过时，对端会按它回包而丢失首次握手。
  urls: []
  auto_update_enabled: false
database:
  type: sqlite
  sqlite:
    path: /data/headscale.sqlite
    write_ahead_log: true
policy:
  mode: file
  path: /etc/headscale/policy.json
dns:
  magic_dns: true
  base_domain: tailnet.kite
  override_local_dns: false
  nameservers:
    global: [1.1.1.1, 8.8.8.8]
unix_socket: /data/headscale.sock
unix_socket_permission: "0700"
disable_check_updates: true
log:
  level: info
logtail:
  enabled: false
taildrop:
  enabled: false
